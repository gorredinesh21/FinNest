spring.jpa.hibernate.ddl-auto=update
# Demo profile (Cloud Run): in-memory H2 with schema auto-created. Set
# DB_PROFILE=mysql and the MYSQL_* vars to run against a real MySQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:mem:finnest;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

server.address=0.0.0.0
server.port=${PORT:8080}

#Disable Default Error Page:
server.error.whitelabel.enabled=false

# FinNest JWT settings
finnest.app.secret=${FINNEST_SECRET:fNn3st_S3cr3t_K3y_Change_Me_In_Production_2026_xY7}
finnest.app.expires.in=604800
